<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokeAPI</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-dark">

  <header class="py-4 border-bottom mb-5">
    <div class="container text-center">
      <h1 class="h3 fw-light tracking-wide text-secondary mb-1">Pokemon API</h1>
      <p class="small text-muted mb-0">Catatalogo de Pokemones! </p>
    </div>
  </header>

  <main class="container mb-5" style="max-width: 960px;">

    <section class="row justify-content-center mb-5">
      <div class="col-12 col-md-8">
        <form id="search-form" class="d-flex gap-2">
          <input 
            type="text" 
            id="search-input" 
            class="form-control rounded-pill px-3 py-2 border-secondary-subtle" 
            placeholder="Buscar por nombre o ID (ej: ditto, 25)..."
            autocomplete="off"
          >
          <button class="btn btn-dark rounded-pill px-4" type="submit">Buscar</button>
          <button class="btn btn-outline-secondary rounded-pill px-3" type="button" id="btn-reset">Volver</button>
        </form>
      </div>
    </section>


    <div id="loading-spinner" class="d-none text-center my-5 py-4">
      <div class="spinner-border spinner-border-sm text-secondary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="small text-muted mt-2">Cargando datos...</p>
    </div>

    <section id="pokemon-container" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
